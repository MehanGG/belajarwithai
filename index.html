function md(t,e,inl){const M=[];t=String(t??"").replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?!\s)([^$\n]*[^\s$])\$/g,(m,a,b,c,d)=>{M.push([a??b??c??d,a!=null||b!=null]);return "@@K"+(M.length-1)+"@@"});t=inl?esc(t):marked.parse(e?esc(t):t);return t.replace(/@@K(\d+)@@/g,(m,i)=>{try{return katex.renderToString(M[i][0].trim(),{displayMode:M[i][1],throwOnError:false})}catch{return esc(M[i][0])}})}

return `# ${O.title}\n\n## Daftar Isi\n${bab.map((b,i)=>`${i+1}. Bab ${i+1}: ${b.judul}`).join("\n")}\n\n${out.join("\n\n")}\n\n${sm}`}
window.mkNote=()=>run(async()=>{const t=await src();addNote(await genNote(t))});
const ytId=u=>{const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/|v\/))([\w-]{11})/);return m&&m[1]};
window.ytNote=()=>run(async()=>{const id=ytId($("#yt").value.trim());if(!id)throw new Error("Link YouTube tidak valid. Contoh: https://youtube.com/watch?v=xxxxxxxxxxx");TT="Catatan YouTube";try{prog("Menonton video…");const vt=await retry(()=>ai("Tonton video ini dan tuliskan seluruh isinya sebagai bahan catatan belajar: poin-poin terstruktur dan lengkap (konsep, istilah, definisi, rumus, contoh, angka, urutan penjelasan). Maksimal 1800 kata. Bahasa Indonesia. Tanpa kalimat pembuka.",{yt:"https://www.youtube.com/watch?v="+id}));addNote(await genNote(vt))}catch(e){throw new Error(e.message+" — Pastikan video publik (bukan private atau dibatasi umur) dan tidak terlalu panjang.")}});
window.gen=k=>run(async o=>{const T=TOOLS[k],sk=T.k||k,t=await src(),it={id:uid(),title:(PRE[k]||"")+TT,...await T.f(t)};S[sk].unshift(it);save();libr(sk);R[sk](it,o)});
window.merge=async()=>{const fs=FILES;if(fs.length<2)return toast("Pilih minimal 2 file PDF");const out=await PDFLib.PDFDocument.create();for(const f of fs){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p))}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([await out.save()],{type:"application/pdf"}));a.download="gabungan.pdf";a.click();toast("PDF digabung")};
// ---- Chat AI dengan izin ----
const CH=`Kamu asisten AI serbaguna di BelajarWithAI: jawab pertanyaan apa saja (boleh Markdown) dan bantu belajar. Jawab dalam bahasa Indonesia. Balas HANYA JSON: {"reply":"jawaban","actions":[...]}.
Jika pengguna butuh sesuatu dibuat/diubah, tambahkan action (maksimal 3), semuanya menunggu persetujuan pengguna:
{"type":"add_note","title":"","content":"markdown"} | {"type":"edit_note","id":"id catatan","title":"","content":"markdown lengkap baru"} | {"type":"add_flashcards","title":"","cards":[{"q":"","a":""}]} | {"type":"add_quiz","title":"","items":[{"q":"","options":["","","",""],"answer":0,"explain":""}]} | {"type":"add_mindmap","title":"","tree":{"title":"topik pusat","desc":"singkat","children":[{"title":"","desc":"","children":[]}]}} (title maks 5 kata, desc maks 15 kata, 4-7 cabang, 3 tingkat).
Untuk add_note dan edit_note, title harus sama dengan judul # pertama (contoh: Catatan Kimia) dan content HARUS mengikuti aturan berikut (lengkapi sendiri walau permintaan pengguna singkat):
${NF}
Kalau tidak perlu mengubah data, actions = [].`;
const AL={add_note:"menambah catatan",edit_note:"mengubah catatan",add_flashcards:"membuat flashcard",add_quiz:"membuat kuis",add_mindmap:"membuat mind map"};
const SUG=["Tolong bikin catatan tentang Kimia","Jelaskan fotosintesis dengan sederhana","Bikin flashcard dari catatanku","Buat kuis tentang sejarah Indonesia"];
window.sg=t=>{$("#ci").value=t;send()};
window.ar=e=>{e.style.height="auto";e.style.height=Math.min(e.scrollHeight,160)+"px"};
function drawChat(){$("#chh").innerHTML=chatHead();$("#cm").innerHTML=C().m.length?C().m.map((m,i)=>`<div class="msg ${m.r}">${md(m.t,1)}</div>`+(m.acts||[]).map((a,j)=>`<div class=act>AI ingin ${AL[a.type]||"mengubah data"} tentang “${esc(a.title)}”${a.st?`<br><b style="color:var(--${a.st=="ok"?"ok":"mut"})">${a.st=="ok"?"Disetujui":"Ditolak"}</b>`:`<br><button class=b onclick="decide(${i},${j},1)">Setuju</button><button class="b g" onclick="decide(${i},${j},0)">Tidak</button>`}</div>`).join("")).join(""):'<div class=hello><h1>Mau belajar apa hari ini?</h1><p class=mut>Tanya apa saja, atau minta AI membuat catatan, flashcard, kuis, dan mind map.</p>'+SUG.map(s=>`<button class=sg onclick="sg(this.textContent)">${s}</button>`).join("")+'</div>';$("#cm").scrollTop=1e9}
window.decide=(i,j,ok)=>{const a=C().m[i].acts[j];if(ok){const id=uid(),t=a.type;if(t=="add_note")S.notes.unshift({id,title:a.title,content:a.content});if(t=="edit_note"){const n=S.notes.find(x=>x.id==a.id);if(n)n.content=a.content}if(t=="add_flashcards")S.decks.unshift({id,title:a.title,cards:a.cards});if(t=="add_quiz")S.quizzes.unshift({id,title:a.title,items:a.items});if(t=="add_mindmap")S.maps.unshift({id,title:a.title,...(a.tree?{tree:a.tree}:{code:clean(a.code||"")})})}a.st=ok?"ok":"no";save();drawChat()};
window.send=async()=>{const i=$("#ci"),m=i.value.trim();if(!m&&!FILES.length)return;const fl=FILES,nm=fl.map(f=>f.name);i.value="";i.style.height="auto";FILES=[];rf();let c=S.chats.find(x=>x.id==S.cid);if(!c){c={id:uid(),title:(m||"Lampiran").slice(0,40),m:[]};S.chats.unshift(c);S.cid=c.id}c.m.push({r:"u",t:(m||"(lampiran)")+(nm.length?"\n\n📎 "+nm.join(", "):"")});save();drawChat();$("#cm").insertAdjacentHTML("beforeend",'<div class="msg load">AI sedang mengetik…</div>');$("#cm").scrollTop=1e9;try{let ft="";const imgs=[];if(fl.filter(isImg).length>4)throw new Error("Maksimal 4 gambar per pesan.");for(const f of fl){if(isImg(f))imgs.push(await toImg(f));else ft+=`\n# ${f.name}\n`+await fileText(f)}const ctx=S.notes.map(n=>`[${n.id}] ${n.title}: ${n.content.slice(0,400)}`).join("\n"),hs=c.m.slice(-10).map(x=>(x.r=="u"?"User: ":"AI: ")+x.t).join("\n"),d=await ai(`Catatan pengguna:\n${ctx||"(kosong)"}${ft?"\n\nFile terlampir:"+ft.slice(0,200000):""}\n\nRiwayat:\n${hs}`,{json:1,system:CH,...(imgs.length?{images:imgs}:{})});c.m.push({r:"a",t:d.reply,acts:d.actions||[]})}catch(e){c.m.push({r:"a",t:"Error: "+e.message})}save();if(S.cid==c.id)drawChat()};
const chatHead=()=>`<button class="b g" onclick="nc()">＋ Chat baru</button><div class=dd><button class="b g" onclick="tg(event)">Riwayat (${S.chats.length}) ▾</button><div class=ddl style="right:0;left:auto;min-width:260px">${S.chats.length?S.chats.map(c=>`<div class="hi ${c.id==S.cid?"on":""}" onclick="oc('${c.id}')"><span>${esc(c.title||"Chat")}</span><i onclick="event.stopPropagation();dc('${c.id}')">Hapus</i></div>`).join(""):"<em>Belum ada riwayat</em>"}</div></div>`;
window.nc=()=>{S.cid="";save();FILES=[];rf();$("#ci").value="";drawChat();$("#ci").focus()};
window.oc=id=>{S.cid=id;save();FILES=[];rf();drawChat()};
window.dc=async id=>{if(!await ask("Hapus chat ini?"))return;S.chats=S.chats.filter(x=>x.id!=id);if(S.cid==id)S.cid="";save();drawChat();toast("Chat dihapus")};
// ---- Tersimpan & backup ----
const LB={notes:"Catatan",decks:"Flashcard",quizzes:"Kuis",essays:"Kuis Esai",exams:"Prediksi Ujian",maps:"Mind Map",sums:"Rangkuman"};
window.exp=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="belajarwithai-backup.json";a.click()};
window.imp=async el=>{try{const d=JSON.parse(await el.files[0].text());for(const k in LB)for(const x of d[k]||[])if(!S[k].some(y=>y.id==x.id))S[k].push(x);save();go("saved");toast("Backup dipulihkan")}catch{toast("File backup tidak valid")}};
// ---- Navigasi ----
const NAV=[["chat","Chat AI"],["notes","Catatan"],["decks","Flashcard"],["quizzes","Kuis"],["essays","Kuis Esai"],["exams","Prediksi Ujian"],["maps","Mind Map"],["sums","Rangkuman"],["solve","Kerjakan Soal"],["merge","Merge PDF"],["saved","Tersimpan"]];
function go(v){dr(0);FILES=[];SEL="";$("#ttl").textContent=NAV.find(x=>x[0]==v)[1];$("#nav").innerHTML='<div class="logo">Belajar<b>WithAI</b></div>'+NAV.map(([k,l])=>`<button class="${k==v?"on":""}" onclick="go('${k}')">${l}</button>`).join("");const M=$("#main");
if(v=="notes"){M.innerHTML=head("Catatan","Ubah file atau video YouTube jadi catatan rapi dan lengkap.")+srcBox()+'<button class=b onclick="mkNote()">Buat catatan dari file</button><div class=card><label>Atau import dari link YouTube</label><input id=yt placeholder="https://youtube.com/watch?v=…"><button class=b onclick="ytNote()">Import dari YouTube</button></div><div id=out></div><div id=lib></div>';libr("notes")}
else if(v=="chat"){M.innerHTML=`<div class=chat><div class=ch id=chh></div><div id=cm></div><div class=comp><div id=fp>${fp(ACC,1)}</div><div class=cin><button class=ib onclick="$('#sf').click()" aria-label="Lampirkan file">＋</button><textarea id=ci rows=1 placeholder="Tanya apa saja, atau minta buat catatan…" oninput="ar(this)" onkeydown="if(event.key=='Enter'&&!event.shiftKey&&innerWidth>800){event.preventDefault();send()}"></textarea><button class="ib go" onclick="send()" aria-label="Kirim">➤</button></div></div></div>`;drawChat()}
else if(v=="merge"){M.innerHTML=head("Merge PDF","Gabungkan beberapa PDF jadi satu (maks 20), langsung di browser.")+'<div class=card><div id=fp>'+fp(".pdf")+'</div><button class=b onclick="merge()">Gabungkan &amp; download</button></div>'}
else if(v=="saved"){const any=Object.keys(LB).some(k=>S[k].length);M.innerHTML=head("Tersimpan","Semua catatan, kuis, dan hasil belajarmu ada di sini.")+(any?Object.entries(LB).map(([k,l])=>S[k].length?`<h3>${l} (${S[k].length})</h3><div class=card>${S[k].map(x=>`<div class=li><button onclick="go('${k}');openI('${k}','${x.id}')">${esc(x.title)}</button><i onclick="del('${k}','${x.id}',1)">Hapus</i></div>`).join("")}</div>`:"").join(""):'<div class=card>Belum ada yang tersimpan. Buat catatan atau kuis dulu.</div>')+'<div class=card><button class=b onclick="exp()">Backup (download)</button><button class="b g" onclick="$(\'#imp\').click()">Restore dari backup</button><input type=file id=imp hidden accept=".json" onchange="imp(this)"></div>'}
else{const T=TOOLS[v];M.innerHTML=head(...T.h)+srcBox()+(v=="exams"?'<div class=card id=eo>'+exOpts()+'</div>':"")+`<button class=b onclick="gen('${v}')">${T.b}</button><div id=out></div><div id=lib></div>`;libr(T.k||v)}}
go("chat");
</script></body></html>
