<style>

.dd{position:relative}.ddb{width:100%;display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;cursor:pointer;text-align:left}
.ddl{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--s2);border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;z-index:20;padding:6px;box-shadow:0 12px 30px #0008}
.dd.open .ddl{display:block}.ddl div{padding:9px 10px;border-radius:8px;cursor:pointer}.ddl div:hover,.ddl div.on{background:var(--s1)}.ddl em{color:var(--mut);padding:9px 10px;display:block;font-style:normal}

.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:#0e1019;font-weight:600}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50}.md2{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(340px,90vw)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:60}
.tag{font-size:12px;background:var(--s2);color:var(--mut);padding:2px 8px;border-radius:6px;margin-left:8px}
input,textarea{font-size:16px}
.bar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.mbtn{background:none;border:0;color:var(--tx);font-size:22px;width:40px;height:40px;border-radius:10px;cursor:pointer}.mbtn:hover{background:var(--s2)}
.lg{font-weight:800}#ttl{margin-left:auto;color:var(--mut);font-size:13px}
#sc{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .22s;z-index:35}
.dopen nav{transform:none}.dopen #sc{opacity:1;pointer-events:auto}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 96px)}
#cm{flex:1;overflow:auto;padding:4px 2px 12px}
.hello{text-align:center;padding:6vh 0 0}.hello .sg{display:block;margin:8px auto;background:var(--s1);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer;max-width:100%}
.comp{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:8px}
.cin{display:flex;align-items:flex-end;gap:6px}.cin textarea{border:0;background:none;resize:none;max-height:160px;padding:10px 6px}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--s2);color:var(--tx);font-size:18px;cursor:pointer;flex:none}.ib.go{background:var(--ac);color:#0e1019}
.lnk{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;display:block;margin:0 auto 8px}.msg.load{color:var(--mut)}
@media(max-width:800px){main{padding:14px}.chat{height:calc(100dvh - 84px)}}
@media(prefers-reduced-motion:reduce){nav,#sc{transition:none}}
body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -120px,rgba(124,92,252,.16),transparent) no-repeat fixed,var(--bg);letter-spacing:-.005em}

.bar{background:rgba(9,9,11,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lg b,.logo b{background:linear-gradient(90deg,#a78bfa,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{background:rgba(17,17,21,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:20px 0 60px rgba(0,0,0,.5)}
nav button{transition:background .15s,color .15s}nav button.on{background:rgba(139,123,255,.14);color:#fff}
h1{font-weight:700;letter-spacing:-.03em}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border-radius:16px}
input,textarea,.ddb{background:rgba(255,255,255,.03);border-radius:12px}

.ddl{background:#17171c;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.55)}.ddl div{transition:background .12s}

.opt{background:rgba(255,255,255,.03);transition:border-color .15s,background .15s}.opt:hover:not(:disabled){border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.08)}
.opt.ok{background:rgba(52,211,153,.12);border-color:var(--ok)}.opt.bad{background:rgba(251,113,133,.12);border-color:var(--bad)}
.seg{background:rgba(255,255,255,.03);border-radius:12px}.seg button.on{background:linear-gradient(135deg,#7c5cfc,#5b6cf9);color:#fff}

.comp{background:rgba(23,23,28,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.msg{border-radius:16px}.msg.u{background:linear-gradient(135deg,rgba(124,92,252,.3),rgba(91,108,249,.2));border-color:rgba(139,123,255,.32)}

.hello h1{background:linear-gradient(90deg,#fff,#b4a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello .sg{background:rgba(255,255,255,.03);transition:border-color .15s,background .15s}.hello .sg:hover{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.08)}
.chip,.tag{border:1px solid var(--line)}
.ov{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.md2{background:#17171c;box-shadow:0 20px 60px rgba(0,0,0,.6)}

.katex{font-size:1.05em}.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.6em 0}
.ch{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.ch .b{margin:0;padding:8px 14px;font-size:14px}.hi{display:flex;justify-content:space-between;gap:12px}.hi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hi i{color:var(--bad);font-style:normal;font-size:12px;flex:none}
</style></head><body>
<header class="bar"><button class="mbtn" onclick="dr(1)" aria-label="Buka menu">☰</button><span class="lg">Belajar<b>WithAI</b></span><span id="ttl"></span></header><div id="sc" onclick="dr(0)"></div><nav id="nav"></nav><main id="main"></main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
mermaid.initialize({startOnLoad:false,theme:"dark",themeVariables:{darkMode:true,background:"#09090b",primaryColor:"#2a2550",primaryTextColor:"#ececf1",lineColor:"#8b7bff"}});
["gesturestart","gesturechange","gestureend"].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key))e.preventDefault();if(e.key=="Escape")dr(0)});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),uid=()=>Math.random().toString(36).slice(2,9);
let S={notes:[],decks:[],quizzes:[],essays:[],exams:[],maps:[],sums:[],chat:[],...JSON.parse(localStorage.bpai||"{}")},TT="",SEL="",FILES=[],EX={t:"mix",n:10,e:3,p:7};
S.chats=S.chats||[];S.cid=S.cid||"";if(S.chat&&S.chat.length){const c={id:uid(),title:String(S.chat[0].t||"Chat").slice(0,40),m:S.chat};S.chats.unshift(c);S.cid=c.id}S.chat=[];
const C=()=>S.chats.find(x=>x.id==S.cid)||{m:[]};
const save=()=>{localStorage.bpai=JSON.stringify(S);const e=$("#sv");if(e){e.textContent="✓ Tersimpan";clearTimeout(save.t);save.t=setTimeout(()=>e.textContent="✓ Tersimpan otomatis",1200)}};
window.dr=o=>document.body.classList.toggle('dopen',!!o);
function md(t,e,inl){const M=[];t=String(t??"").replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?!\s)([^$\n]*[^\s$])\$/g,(m,a,b,c,d)=>{M.push([a??b??c??d,a!=null||b!=null]);return "@@K"+(M.length-1)+"@@"});t=inl?esc(t):marked.parse(e?esc(t):t);return t.replace(/@@K(\d+)@@/g,(m,i)=>{try{return katex.renderToString(M[i][0].trim(),{displayMode:M[i][1],throwOnError:false})}catch{return esc(M[i][0])}})}
const clean=s=>s.replace(/```\w*/g,"").trim();
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)}
function ask(msg){return new Promise(r=>{const m=document.createElement("div");m.className="ov";m.innerHTML=`<div class=md2><p>${esc(msg)}</p><button class=b>Hapus</button><button class="b g">Batal</button></div>`;const[a,b]=m.querySelectorAll("button");a.onclick=()=>{m.remove();r(1)};b.onclick=()=>{m.remove();r(0)};document.body.append(m)})}
async function ai(prompt,o={}){const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,...o})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Permintaan gagal");return o.json?JSON.parse(clean(d.text)):d.text}
async function fileText(f){if(/\.pdf$/i.test(f.name)){const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let i=1;i<=p.numPages;i++)t+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n";return t}return f.text()}
// ---- Komponen UI sendiri (tanpa UI bawaan browser) ----
const dd=()=>{const n=S.notes.find(x=>x.id==SEL);return `<div class=dd><button class=ddb onclick="tg(event)"><span>${n?esc(n.title):"Pilih catatan"}</span><i>▾</i></button><div class=ddl>${S.notes.length?`<div onclick="pk('')">Tanpa catatan</div>`+S.notes.map(x=>`<div class="${x.id==SEL?"on":""}" onclick="pk('${x.id}')">${esc(x.title)}</div>`).join(""):"<em>Belum ada catatan</em>"}</div></div>`};
const fp=(a,m)=>(m?"":`<div class=drop onclick="$('#sf').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();addF(event.dataTransfer.files)">Pilih atau tarik file ke sini<small>${a.replace(/\./g,"").replace(/,/g,", ").toUpperCase()} · maks 20 file</small></div>`)+FILES.map((f,i)=>`<span class=chip>${esc(f.name)}<i onclick="rmF(${i})">✕</i></span>`).join("")+`<input type=file id=sf hidden ${m?"data-m=1":""} multiple accept="${a}" onchange="addF(this.files);this.value=''">`;
const srcBox=()=>`<div class=card><label>Pilih catatan</label><div id=dd>${dd()}</div><label>atau upload file</label><div id=fp>${fp(".pdf,.txt,.md")}</div></div>`;
window.tg=e=>{e.stopPropagation();const d=e.currentTarget.parentNode,o=d.classList.contains("open");document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open"));if(!o)d.classList.add("open")};
document.addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open")));
window.pk=id=>{SEL=id;$("#dd").innerHTML=dd()};
const rf=()=>{const s=$("#sf");$("#fp").innerHTML=fp(s.accept,s.dataset.m)};
window.addF=fl=>{const a=$("#sf").accept.split(","),ok=[...fl].filter(f=>a.some(x=>f.name.toLowerCase().endsWith(x))),all=[...FILES,...ok];if(all.length>20)toast("Maksimal 20 file");FILES=all.slice(0,20);rf()};
window.rmF=i=>{FILES.splice(i,1);rf()};
async function src(){if(FILES.length){TT=FILES.length>1?FILES.length+" file":FILES[0].name;let t="";for(const f of FILES)t+=`\n# ${f.name}\n`+await fileText(f);return t.slice(0,300000)}const n=S.notes.find(x=>x.id==SEL);if(!n)throw new Error("Pilih catatan atau upload file dulu.");TT=n.title;return n.content}
async function run(fn){const o=$("#out");o.innerHTML='<div class=load>AI sedang bekerja…</div>';try{await fn(o)}catch(e){o.innerHTML=`<div class=err>${esc(e.message)}</div>`}}
const head=(t,d)=>`<h1>${t}</h1><p class=mut>${d}</p>`;
const libr=k=>{$("#lib").innerHTML=S[k].length?"<h3>Tersimpan</h3>"+S[k].map(x=>`<div class=li><button onclick="openI('${k}','${x.id}')">${esc(x.title)}</button><i onclick="del('${k}','${x.id}')">Hapus</i></div>`).join(""):""};
window.openI=(k,id)=>R[k](S[k].find(x=>x.id==id),$("#out"));
window.del=async(k,id,rf)=>{if(!await ask("Hapus item ini? Tidak bisa dibatalkan."))return;S[k]=S[k].filter(x=>x.id!=id);save();if(rf)go("saved");else{libr(k);$("#out").innerHTML=""}toast("Dihapus")};
// ---- Render hasil ----
const opts=(k,id,it,i)=>it.options.map((x,j)=>{const d=it.pk!=null,c=d?(j==it.answer?" ok":j==it.pk?" bad":""):"";return `<button class="opt${c}" ${d?"disabled":""} onclick="pick('${k}','${id}',${i},${j})">${md(x,0,1)}</button>`}).join("")+(it.pk!=null?`<p class=ex>${md(it.explain,0,1)}</p>`:"");
const itm=(k,id,it,i)=>{const e=!it.options;return `<div class=card><p><b>${i+1}. ${md(it.q,0,1)}</b><span class=tag>${e?"Essay":"PG"}</span></p>${it.why?`<p class=mut>Prediksi: ${md(it.why,0,1)}</p>`:""}`+(e?`<textarea rows=4 placeholder="Tulis jawabanmu…" oninput="sv('${k}','${id}',${i},this.value)">${esc(it.ans||"")}</textarea><button class=b onclick="grade('${k}','${id}',${i})">Nilai dengan AI</button><div class=md id=g${i}>${it.fb?md(it.fb):""}</div>`:opts(k,id,it,i))+"</div>"};
const lst=k=>(q,o)=>o.innerHTML=q.items.map((it,i)=>itm(k,q.id,it,i)).join("");
const R={
notes:(n,o,e)=>o.innerHTML=e?`<div class=card><textarea rows=16 oninput="ed('${n.id}',this.value)">${esc(n.content)}</textarea><button class=b onclick="libr('notes');openI('notes','${n.id}')">Selesai</button><button class="b g" onclick="pdf('${n.id}')">Download PDF</button></div>`:`<div class="card md">${md(n.content)}</div><button class=b onclick="pdf('${n.id}')">Download PDF</button><button class="b g" onclick="R.notes(S.notes.find(x=>x.id=='${n.id}'),$('#out'),1)">Edit catatan</button>`,

const TOOLS={
decks:{h:["Flashcard","Buat kartu hafalan dari catatan atau file."],b:"Buat flashcard",f:async t=>({cards:await ai('Buat 15-25 flashcard (pertanyaan singkat, jawaban ringkas) dari materi. Balas JSON: [{"q":"","a":""}].\n\n'+t,{json:1})})},
quizzes:{h:["Kuis","Soal pilihan ganda dengan pembahasan."],b:"Buat kuis",f:async t=>({items:await ai('Buat 10 soal pilihan ganda 4 opsi dari materi. Balas JSON: [{"q":"","options":["","","",""],"answer":0,"explain":""}] (answer = indeks opsi benar).\n\n'+t,{json:1})})},
essays:{h:["Kuis Esai","Latihan menulis jawaban, dinilai AI."],b:"Buat soal esai",f:async t=>({items:await ai('Buat 5 soal esai dari materi. Balas JSON: [{"q":"","key":"kunci jawaban lengkap"}]\n\n'+t,{json:1})})},
exams:{h:["Prediksi Ujian","AI menebak soal yang paling mungkin keluar dari materimu."],b:"Prediksi soal ujian",f:async t=>{const ne=EX.t=="essay"?EX.n:EX.t=="mix"?EX.e:0,np=EX.t=="pg"?EX.n:EX.t=="mix"?EX.p:0;return{items:await ai(`Kamu guru berpengalaman. Dari materi berikut, prediksi soal yang paling mungkin keluar di ujian (fokus pada konsep penting, bagian yang ditekankan, dan yang sering diujikan). Buat tepat ${np} soal pilihan ganda dan ${ne} soal essay, urut dari yang paling mungkin keluar. Balas JSON array. PG: {"q":"","options":["","","",""],"answer":0,"explain":"","why":"alasan singkat kenapa diprediksi keluar"}. Essay: {"q":"","key":"kunci jawaban lengkap","why":"alasan singkat"}.\n\n`+t,{json:1})}}},
maps:{h:["Mind Map","Peta konsep dengan live preview dan download."],b:"Buat mind map",f:async t=>({code:clean(await ai(MM+t))})},
sums:{h:["Rangkuman","Ringkas materi jadi poin penting."],b:"Rangkum",f:async t=>({content:await ai("Rangkum materi ini dalam Markdown: ringkasan singkat, poin-poin kunci, istilah penting.\n\n"+t)})},
solve:{k:"sums",h:["Kerjakan Soal","Upload file soal, AI menjawab lengkap dengan langkahnya."],b:"Kerjakan soal",f:async t=>({content:await ai("Kerjakan semua soal berikut. Untuk tiap soal beri langkah pengerjaan dan jawaban akhir (Markdown).\n\n"+t)})}};
const PRE={solve:"Soal: ",exams:"Prediksi: "};
const NF=`Kamu penulis catatan pelajaran profesional. Tulis catatan belajar yang LENGKAP, rapi, dan terstruktur per BAB dalam Markdown, dalam bahasa Indonesia.
Format wajib:
- Baris pertama: # Catatan <Topik/Mata Pelajaran> (contoh: # Catatan Kimia).
- Lalu ## Daftar Isi berisi daftar semua Bab.
- Isi dibagi menjadi Bab: ## Bab 1: <Judul Bab>, ## Bab 2: <Judul Bab>, dst. Tiap Bab punya sub-bab (### 1.1 ..., ### 1.2 ...) berisi penjelasan, definisi, rumus, contoh, dan tabel bila membantu, lalu diakhiri dengan **Poin Penting**.
- Akhiri dengan ## Ringkasan.
Aturan isi:
- Kalau materi dari pengguna tidak lengkap, hanya sebagian, atau hanya berupa judul/topik, LENGKAPI sendiri dengan pengetahuanmu sampai topiknya tercakup menyeluruh (setingkat kurikulum), tanpa membuang isi dari pengguna.
- Rumus matematika/kimia ditulis dengan LaTeX: inline $...$ dan blok $$...$$ (rumus reaksi kimia boleh pakai \ce{H2O}).
- Rapi dan konsisten: judul jelas, poin pendek, istilah penting dicetak tebal. Jangan ada kalimat pembuka atau penutup di luar catatan.`;
const P=NF+"\n\nMateri dari pengguna:\n";
function addNote(md){const n={id:uid(),title:(md.match(/^#\s+(.+)/m)||[0,TT||"Catatan"])[1],content:md};S.notes.unshift(n);save();libr("notes");R.notes(n,$("#out"))}
window.mkNote=()=>run(async()=>addNote(await ai(P+await src())));
window.ytNote=()=>run(async()=>{const u=$("#yt").value.trim();if(!/youtu/.test(u))throw new Error("Masukkan link YouTube yang valid.");TT="Catatan YouTube";addNote(await ai(P+"(materi: video YouTube terlampir)",{yt:u}))});
window.gen=k=>run(async o=>{const T=TOOLS[k],sk=T.k||k,t=await src(),it={id:uid(),title:(PRE[k]||"")+TT,...await T.f(t)};S[sk].unshift(it);save();libr(sk);R[sk](it,o)});
window.merge=async()=>{const fs=FILES;if(fs.length<2)return toast("Pilih minimal 2 file PDF");const out=await PDFLib.PDFDocument.create();for(const f of fs){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p))}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([await out.save()],{type:"application/pdf"}));a.download="gabungan.pdf";a.click();toast("PDF digabung")};
// ---- Chat AI dengan izin ----
const CH=`Kamu asisten AI serbaguna di BelajarWithAI: jawab pertanyaan apa saja (boleh Markdown) dan bantu belajar. Jawab dalam bahasa Indonesia. Balas HANYA JSON: {"reply":"jawaban","actions":[...]}.
Jika pengguna butuh sesuatu dibuat/diubah, tambahkan action (maksimal 3), semuanya menunggu persetujuan pengguna:
{"type":"add_note","title":"","content":"markdown"} | {"type":"edit_note","id":"id catatan","title":"","content":"markdown lengkap baru"} | {"type":"add_flashcards","title":"","cards":[{"q":"","a":""}]} | {"type":"add_quiz","title":"","items":[{"q":"","options":["","","",""],"answer":0,"explain":""}]} | {"type":"add_mindmap","title":"","code":"kode mermaid mindmap"}.
Untuk add_note dan edit_note, title harus sama dengan judul # pertama (contoh: Catatan Kimia) dan content HARUS mengikuti aturan berikut (lengkapi sendiri walau permintaan pengguna singkat):
${NF}
Kalau tidak perlu mengubah data, actions = [].`;
const AL={add_note:"menambah catatan",edit_note:"mengubah catatan",add_flashcards:"membuat flashcard",add_quiz:"membuat kuis",add_mindmap:"membuat mind map"};
const SUG=["Tolong bikin catatan tentang Kimia","Jelaskan fotosintesis dengan sederhana","Bikin flashcard dari catatanku","Buat kuis tentang sejarah Indonesia"];

function drawChat(){$("#chh").innerHTML=chatHead();$("#cm").innerHTML=C().m.length?C().m.map((m,i)=>`<div class="msg ${m.r}">${md(m.t,1)}</div>`+(m.acts||[]).map((a,j)=>`<div class=act>AI ingin ${AL[a.type]||"mengubah data"} tentang “${esc(a.title)}”${a.st?`<br><b style="color:var(--${a.st=="ok"?"ok":"mut"})">${a.st=="ok"?"Disetujui":"Ditolak"}</b>`:`<br><button class=b onclick="decide(${i},${j},1)">Setuju</button><button class="b g" onclick="decide(${i},${j},0)">Tidak</button>`}</div>`).join("")).join(""):'<div class=hello><h1>Mau belajar apa hari ini?</h1><p class=mut>Tanya apa saja, atau minta AI membuat catatan, flashcard, kuis, dan mind map.</p>'+SUG.map(s=>`<button class=sg onclick="sg(this.textContent)">${s}</button>`).join("")+'</div>';$("#cm").scrollTop=1e9}
window.decide=(i,j,ok)=>{const a=C().m[i].acts[j];if(ok){const id=uid(),t=a.type;if(t=="add_note")S.notes.unshift({id,title:a.title,content:a.content});if(t=="edit_note"){const n=S.notes.find(x=>x.id==a.id);if(n)n.content=a.content}if(t=="add_flashcards")S.decks.unshift({id,title:a.title,cards:a.cards});if(t=="add_quiz")S.quizzes.unshift({id,title:a.title,items:a.items});if(t=="add_mindmap")S.maps.unshift({id,title:a.title,code:clean(a.code)})}a.st=ok?"ok":"no";save();drawChat()};
window.send=async()=>{const i=$("#ci"),m=i.value.trim();if(!m&&!FILES.length)return;const fl=FILES,nm=fl.map(f=>f.name);i.value="";i.style.height="auto";FILES=[];rf();let c=S.chats.find(x=>x.id==S.cid);if(!c){c={id:uid(),title:(m||"Lampiran").slice(0,40),m:[]};S.chats.unshift(c);S.cid=c.id}c.m.push({r:"u",t:(m||"(lampiran)")+(nm.length?"\n\n📎 "+nm.join(", "):"")});save();drawChat();$("#cm").insertAdjacentHTML("beforeend",'<div class="msg load">AI sedang mengetik…</div>');$("#cm").scrollTop=1e9;try{let ft="";for(const f of fl)ft+=`\n# ${f.name}\n`+await fileText(f);const ctx=S.notes.map(n=>`[${n.id}] ${n.title}: ${n.content.slice(0,400)}`).join("\n"),hs=c.m.slice(-10).map(x=>(x.r=="u"?"User: ":"AI: ")+x.t).join("\n"),d=await ai(`Catatan pengguna:\n${ctx||"(kosong)"}${ft?"\n\nFile terlampir:"+ft.slice(0,200000):""}\n\nRiwayat:\n${hs}`,{json:1,system:CH});c.m.push({r:"a",t:d.reply,acts:d.actions||[]})}catch(e){c.m.push({r:"a",t:"Error: "+e.message})}save();if(S.cid==c.id)drawChat()};
const chatHead=()=>`<button class="b g" onclick="nc()">＋ Chat baru</button><div class=dd><button class="b g" onclick="tg(event)">Riwayat (${S.chats.length}) ▾</button><div class=ddl style="right:0;left:auto;min-width:260px">${S.chats.length?S.chats.map(c=>`<div class="hi ${c.id==S.cid?"on":""}" onclick="oc('${c.id}')"><span>${esc(c.title||"Chat")}</span><i onclick="event.stopPropagation();dc('${c.id}')">Hapus</i></div>`).join(""):"<em>Belum ada riwayat</em>"}</div></div>`;

window.oc=id=>{S.cid=id;save();FILES=[];rf();drawChat()};

const NAV=[["chat","Chat AI"],["notes","Catatan"],["decks","Flashcard"],["quizzes","Kuis"],["essays","Kuis Esai"],["exams","Prediksi Ujian"],["maps","Mind Map"],["sums","Rangkuman"],["solve","Kerjakan Soal"],["merge","Merge PDF"],["saved","Tersimpan"]];

else if(v=="merge"){M.innerHTML=head("Merge PDF","Gabungkan beberapa PDF jadi satu (maks 20), langsung di browser.")+'<div class=card><div id=fp>'+fp(".pdf")+'</div><button class=b onclick="merge()">Gabungkan &amp; download</button></div>'}
else if(v=="saved"){const any=Object.keys(LB).some(k=>S[k].length);M.innerHTML=head("Tersimpan","Semua catatan, kuis, dan hasil belajarmu ada di sini.")+(any?Object.entries(LB).map(([k,l])=>S[k].length?`<h3>${l} (${S[k].length})</h3><div class=card>${S[k].map(x=>`<div class=li><button onclick="go('${k}');openI('${k}','${x.id}')">${esc(x.title)}</button><i onclick="del('${k}','${x.id}',1)">Hapus</i></div>`).join("")}</div>`:"").join(""):'<div class=card>Belum ada yang tersimpan. Buat catatan atau kuis dulu.</div>')+'<div class=card><button class=b onclick="exp()">Backup (download)</button><button class="b g" onclick="$(\'#imp\').click()">Restore dari backup</button><input type=file id=imp hidden accept=".json" onchange="imp(this)"></div>'}
else{const T=TOOLS[v];M.innerHTML=head(...T.h)+srcBox()+(v=="exams"?'<div class=card id=eo>'+exOpts()+'</div>':"")+`<button class=b onclick="gen('${v}')">${T.b}</button><div id=out></div><div id=lib></div>`;libr(T.k||v)}}
go("chat");
