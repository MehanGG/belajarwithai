<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BelajarWithAI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{--bg:#0e1019;--s1:#161a29;--s2:#1e2338;--line:#2a3050;--tx:#e8eaf6;--mut:#8e95b8;--ac:#8f9bff;--ok:#5fd4a0;--bad:#ff7b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:230px;background:var(--s1);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:18px;padding:0 10px 18px}.logo b{color:var(--ac)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:var(--s2);color:var(--tx)}
#sv{padding:12px;font-size:12px;margin:0}
main{flex:1;padding:32px;max-width:860px;margin:auto;width:100%;min-width:0}
h1{margin:0;font-size:28px;letter-spacing:-.02em}h3{margin:24px 0 8px}.mut{color:var(--mut);margin:4px 0 20px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}label:first-child{margin-top:0}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;resize:vertical;-webkit-appearance:none}
input:focus,textarea:focus{border-color:#454e7a}
.b{background:var(--ac);color:#0e1019;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:10px 8px 0 0}
.b.g{background:var(--s2);color:var(--tx)}
.load,.err{padding:14px;border-radius:10px;margin:12px 0;background:var(--s2)}.err{color:var(--bad)}
.md h1,.md h2{margin:.8em 0 .3em}.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--line);padding:6px 10px}.md code{background:var(--s2);padding:2px 5px;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fc{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:120px;cursor:pointer}
.fc span{display:none;color:var(--ok);margin-top:10px}.fc.f span{display:block}.fc.f b{opacity:.6}
.opt{display:block;width:100%;text-align:left;background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#12332a}.opt.bad{border-color:var(--bad);background:#3a1a22}.ex{color:var(--mut)}
.li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li button{background:none;border:0;color:var(--tx);padding:10px 0;font:inherit;cursor:pointer;text-align:left}.li i{color:var(--bad);cursor:pointer;font-style:normal;padding:10px 0;font-size:13px}
.mp{overflow:auto;background:var(--bg);border-radius:10px;padding:10px}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%;background:var(--s1);border:1px solid var(--line)}.msg.u{margin-left:auto;background:var(--s2)}
.act{border:1px dashed var(--ac);border-radius:12px;padding:12px;margin:8px 0;max-width:88%}.act .b{margin-top:6px}
.dd{position:relative}.ddb{width:100%;display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;cursor:pointer;text-align:left}
.ddl{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--s2);border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;z-index:20;padding:6px;box-shadow:0 12px 30px #0008}
.dd.open .ddl{display:block}.ddl div{padding:9px 10px;border-radius:8px;cursor:pointer}.ddl div:hover,.ddl div.on{background:var(--s1)}.ddl em{color:var(--mut);padding:9px 10px;display:block;font-style:normal}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}.drop small{display:block;font-size:12px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--s2);border-radius:999px;padding:4px 12px;margin:8px 6px 0 0;font-size:13px}.chip i{cursor:pointer;font-style:normal;color:var(--mut)}
.st{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px}.st button{background:none;border:0;color:var(--tx);width:40px;height:40px;font-size:18px;cursor:pointer}.st b{min-width:40px;text-align:center}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:#0e1019;font-weight:600}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50}.md2{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(340px,90vw)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:60}
.tag{font-size:12px;background:var(--s2);color:var(--mut);padding:2px 8px;border-radius:6px;margin-left:8px}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:10px}nav button{white-space:nowrap;width:auto}.logo,#sv{display:none}main{padding:18px}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
mermaid.initialize({startOnLoad:false,theme:"dark"});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),uid=()=>Math.random().toString(36).slice(2,9);
let S={notes:[],decks:[],quizzes:[],essays:[],exams:[],maps:[],sums:[],chat:[],...JSON.parse(localStorage.bpai||"{}")},TT="",SEL="",FILES=[],EX={t:"mix",n:10,e:3,p:7};
const save=()=>{localStorage.bpai=JSON.stringify(S);const e=$("#sv");if(e){e.textContent="✓ Tersimpan";clearTimeout(save.t);save.t=setTimeout(()=>e.textContent="✓ Tersimpan otomatis",1200)}};
const clean=s=>s.replace(/```\w*/g,"").trim();
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)}
function ask(msg){return new Promise(r=>{const m=document.createElement("div");m.className="ov";m.innerHTML=`<div class=md2><p>${esc(msg)}</p><button class=b>Hapus</button><button class="b g">Batal</button></div>`;const[a,b]=m.querySelectorAll("button");a.onclick=()=>{m.remove();r(1)};b.onclick=()=>{m.remove();r(0)};document.body.append(m)})}
async function ai(prompt,o={}){const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,...o})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Permintaan gagal");return o.json?JSON.parse(clean(d.text)):d.text}
async function fileText(f){if(/\.pdf$/i.test(f.name)){const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let i=1;i<=p.numPages;i++)t+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n";return t}return f.text()}
// ---- Komponen UI sendiri (tanpa UI bawaan browser) ----
const dd=()=>{const n=S.notes.find(x=>x.id==SEL);return `<div class=dd><button class=ddb onclick="tg(event)"><span>${n?esc(n.title):"Pilih catatan"}</span><i>▾</i></button><div class=ddl>${S.notes.length?`<div onclick="pk('')">Tanpa catatan</div>`+S.notes.map(x=>`<div class="${x.id==SEL?"on":""}" onclick="pk('${x.id}')">${esc(x.title)}</div>`).join(""):"<em>Belum ada catatan</em>"}</div></div>`};
const fp=a=>`<div class=drop onclick="$('#sf').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();addF(event.dataTransfer.files)">Pilih atau tarik file ke sini<small>${a.replace(/\./g,"").replace(/,/g,", ").toUpperCase()} · maks 20 file</small></div>${FILES.map((f,i)=>`<span class=chip>${esc(f.name)}<i onclick="rmF(${i})">✕</i></span>`).join("")}<input type=file id=sf hidden multiple accept="${a}" onchange="addF(this.files);this.value=''">`;
const srcBox=()=>`<div class=card><label>Pilih catatan</label><div id=dd>${dd()}</div><label>atau upload file</label><div id=fp>${fp(".pdf,.txt,.md")}</div></div>`;
window.tg=e=>{e.stopPropagation();const d=e.currentTarget.parentNode,o=d.classList.contains("open");document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open"));if(!o)d.classList.add("open")};
document.addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open")));
window.pk=id=>{SEL=id;$("#dd").innerHTML=dd()};
window.addF=fl=>{const a=$("#sf").accept.split(","),ok=[...fl].filter(f=>a.some(x=>f.name.toLowerCase().endsWith(x))),all=[...FILES,...ok];if(all.length>20)toast("Maksimal 20 file");FILES=all.slice(0,20);$("#fp").innerHTML=fp($("#sf").accept)};
window.rmF=i=>{const a=$("#sf").accept;FILES.splice(i,1);$("#fp").innerHTML=fp(a)};
async function src(){if(FILES.length){TT=FILES.length>1?FILES.length+" file":FILES[0].name;let t="";for(const f of FILES)t+=`\n# ${f.name}\n`+await fileText(f);return t.slice(0,300000)}const n=S.notes.find(x=>x.id==SEL);if(!n)throw new Error("Pilih catatan atau upload file dulu.");TT=n.title;return n.content}
async function run(fn){const o=$("#out");o.innerHTML='<div class=load>AI sedang bekerja…</div>';try{await fn(o)}catch(e){o.innerHTML=`<div class=err>${esc(e.message)}</div>`}}
const head=(t,d)=>`<h1>${t}</h1><p class=mut>${d}</p>`;
const libr=k=>{$("#lib").innerHTML=S[k].length?"<h3>Tersimpan</h3>"+S[k].map(x=>`<div class=li><button onclick="openI('${k}','${x.id}')">${esc(x.title)}</button><i onclick="del('${k}','${x.id}')">Hapus</i></div>`).join(""):""};
window.openI=(k,id)=>R[k](S[k].find(x=>x.id==id),$("#out"));
window.del=async(k,id,rf)=>{if(!await ask("Hapus item ini? Tidak bisa dibatalkan."))return;S[k]=S[k].filter(x=>x.id!=id);save();if(rf)go("saved");else{libr(k);$("#out").innerHTML=""}toast("Dihapus")};
// ---- Render hasil ----
const opts=(k,id,it,i)=>it.options.map((x,j)=>{const d=it.pk!=null,c=d?(j==it.answer?" ok":j==it.pk?" bad":""):"";return `<button class="opt${c}" ${d?"disabled":""} onclick="pick('${k}','${id}',${i},${j})">${esc(x)}</button>`}).join("")+(it.pk!=null?`<p class=ex>${esc(it.explain)}</p>`:"");
const itm=(k,id,it,i)=>{const e=!it.options;return `<div class=card><p><b>${i+1}. ${esc(it.q)}</b><span class=tag>${e?"Essay":"PG"}</span></p>${it.why?`<p class=mut>Prediksi: ${esc(it.why)}</p>`:""}`+(e?`<textarea rows=4 placeholder="Tulis jawabanmu…" oninput="sv('${k}','${id}',${i},this.value)">${esc(it.ans||"")}</textarea><button class=b onclick="grade('${k}','${id}',${i})">Nilai dengan AI</button><div class=md id=g${i}>${it.fb?marked.parse(it.fb):""}</div>`:opts(k,id,it,i))+"</div>"};
const lst=k=>(q,o)=>o.innerHTML=q.items.map((it,i)=>itm(k,q.id,it,i)).join("");
const R={
notes:(n,o,e)=>o.innerHTML=e?`<div class=card><textarea rows=16 oninput="ed('${n.id}',this.value)">${esc(n.content)}</textarea><button class=b onclick="libr('notes');openI('notes','${n.id}')">Selesai</button></div>`:`<div class="card md">${marked.parse(n.content)}</div><button class="b g" onclick="R.notes(S.notes.find(x=>x.id=='${n.id}'),$('#out'),1)">Edit catatan</button>`,
sums:(n,o)=>o.innerHTML=`<div class="card md">${marked.parse(n.content)}</div>`,
decks:(d,o)=>o.innerHTML=`<div class=grid>${d.cards.map(c=>`<div class=fc onclick="this.classList.toggle('f')"><b>${esc(c.q)}</b><span>${esc(c.a)}</span></div>`).join("")}</div>`,
quizzes:lst("quizzes"),essays:lst("essays"),exams:lst("exams"),
maps:(m,o)=>{o.innerHTML=`<div class=card><label>Kode mind map (edit, preview langsung berubah)</label><textarea id=mc rows=8>${esc(m.code)}</textarea></div><div class=card><div id=mp class=mp></div><button class=b onclick="dlMap()">Download SVG</button></div>`;const draw=async()=>{try{await mermaid.parse($("#mc").value);$("#mp").innerHTML=(await mermaid.render("m"+uid(),$("#mc").value)).svg}catch{}};draw();$("#mc").oninput=()=>{m.code=$("#mc").value;save();draw()}}};
window.ed=(id,v)=>{const n=S.notes.find(x=>x.id==id);n.content=v;n.title=(v.match(/^#\s+(.+)/m)||[0,n.title])[1];save()};
window.pick=(k,id,i,j)=>{const q=S[k].find(x=>x.id==id);q.items[i].pk=j;save();R[k](q,$("#out"))};
window.sv=(k,id,i,v)=>{S[k].find(x=>x.id==id).items[i].ans=v;save()};
window.grade=async(k,id,i)=>{const it=S[k].find(x=>x.id==id).items[i],g=$("#g"+i);g.textContent="Menilai…";try{it.fb=await ai(`Soal: ${it.q}\nKunci jawaban: ${it.key}\nJawaban siswa: ${it.ans||"(kosong)"}\n\nBeri nilai 0-100, apa yang sudah benar, dan apa yang kurang. Singkat.`);save();g.innerHTML=marked.parse(it.fb)}catch(e){g.textContent=e.message}};
window.dlMap=()=>{const s=$("#mp svg");s.style.background="#0e1019";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s.outerHTML],{type:"image/svg+xml"}));a.download="mindmap.svg";a.click()};
// ---- Opsi prediksi ujian ----
const exOpts=()=>{const st=k=>`<div class=st><button onclick="stp('${k}',-1)">−</button><b>${EX[k]}</b><button onclick="stp('${k}',1)">+</button></div>`;return `<label>Tipe soal</label><div class=seg>${[["pg","Pilihan ganda"],["essay","Essay"],["mix","Campur"]].map(([k,l])=>`<button class="${EX.t==k?"on":""}" onclick="EX.t='${k}';$('#eo').innerHTML=exOpts()">${l}</button>`).join("")}</div>`+(EX.t=="mix"?`<label>Berapa Essay</label>${st("e")}<label>Berapa PG</label>${st("p")}`:`<label>Berapa soal</label>${st("n")}`)};
window.stp=(k,d)=>{EX[k]=Math.max(1,Math.min(50,EX[k]+d));$("#eo").innerHTML=exOpts()};
const MM='Buat mind map dalam sintaks Mermaid "mindmap" (baris pertama: mindmap, lalu root((Topik)) dan cabang dengan indentasi). Jangan pakai tanda ()[]{} di teks node selain root. Balas hanya kodenya.\n\n';
const TOOLS={
decks:{h:["Flashcard","Buat kartu hafalan dari catatan atau file."],b:"Buat flashcard",f:async t=>({cards:await ai('Buat 15-25 flashcard (pertanyaan singkat, jawaban ringkas) dari materi. Balas JSON: [{"q":"","a":""}].\n\n'+t,{json:1})})},
quizzes:{h:["Kuis","Soal pilihan ganda dengan pembahasan."],b:"Buat kuis",f:async t=>({items:await ai('Buat 10 soal pilihan ganda 4 opsi dari materi. Balas JSON: [{"q":"","options":["","","",""],"answer":0,"explain":""}] (answer = indeks opsi benar).\n\n'+t,{json:1})})},
essays:{h:["Kuis Esai","Latihan menulis jawaban, dinilai AI."],b:"Buat soal esai",f:async t=>({items:await ai('Buat 5 soal esai dari materi. Balas JSON: [{"q":"","key":"kunci jawaban lengkap"}]\n\n'+t,{json:1})})},
exams:{h:["Prediksi Ujian","AI menebak soal yang paling mungkin keluar dari materimu."],b:"Prediksi soal ujian",f:async t=>{const ne=EX.t=="essay"?EX.n:EX.t=="mix"?EX.e:0,np=EX.t=="pg"?EX.n:EX.t=="mix"?EX.p:0;return{items:await ai(`Kamu guru berpengalaman. Dari materi berikut, prediksi soal yang paling mungkin keluar di ujian (fokus pada konsep penting, bagian yang ditekankan, dan yang sering diujikan). Buat tepat ${np} soal pilihan ganda dan ${ne} soal essay, urut dari yang paling mungkin keluar. Balas JSON array. PG: {"q":"","options":["","","",""],"answer":0,"explain":"","why":"alasan singkat kenapa diprediksi keluar"}. Essay: {"q":"","key":"kunci jawaban lengkap","why":"alasan singkat"}.\n\n`+t,{json:1})}}},
maps:{h:["Mind Map","Peta konsep dengan live preview dan download."],b:"Buat mind map",f:async t=>({code:clean(await ai(MM+t))})},
sums:{h:["Rangkuman","Ringkas materi jadi poin penting."],b:"Rangkum",f:async t=>({content:await ai("Rangkum materi ini dalam Markdown: ringkasan singkat, poin-poin kunci, istilah penting.\n\n"+t)})},
solve:{k:"sums",h:["Kerjakan Soal","Upload file soal, AI menjawab lengkap dengan langkahnya."],b:"Kerjakan soal",f:async t=>({content:await ai("Kerjakan semua soal berikut. Untuk tiap soal beri langkah pengerjaan dan jawaban akhir (Markdown).\n\n"+t)})}};
const PRE={solve:"Soal: ",exams:"Prediksi: "};
const P="Buat catatan belajar yang rapi, lengkap, dan terstruktur dalam Markdown (judul, subjudul, poin, definisi, contoh, tabel bila perlu). Baris pertama harus '# Judul'.\n\n";
function addNote(md){const n={id:uid(),title:(md.match(/^#\s+(.+)/m)||[0,TT||"Catatan"])[1],content:md};S.notes.unshift(n);save();libr("notes");R.notes(n,$("#out"))}
window.mkNote=()=>run(async()=>addNote(await ai(P+await src())));
window.ytNote=()=>run(async()=>{const u=$("#yt").value.trim();if(!/youtu/.test(u))throw new Error("Masukkan link YouTube yang valid.");TT="Catatan YouTube";addNote(await ai(P+"(materi: video YouTube terlampir)",{yt:u}))});
window.gen=k=>run(async o=>{const T=TOOLS[k],sk=T.k||k,t=await src(),it={id:uid(),title:(PRE[k]||"")+TT,...await T.f(t)};S[sk].unshift(it);save();libr(sk);R[sk](it,o)});
window.merge=async()=>{const fs=FILES;if(fs.length<2)return toast("Pilih minimal 2 file PDF");const out=await PDFLib.PDFDocument.create();for(const f of fs){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p))}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([await out.save()],{type:"application/pdf"}));a.download="gabungan.pdf";a.click();toast("PDF digabung")};
// ---- Chat AI dengan izin ----
const CH=`Kamu asisten belajar di BelajarWithAI. Jawab dalam bahasa Indonesia. Balas HANYA JSON: {"reply":"jawaban","actions":[...]}.
Jika pengguna butuh sesuatu dibuat/diubah, tambahkan action (maksimal 3), semuanya menunggu persetujuan pengguna:
{"type":"add_note","title":"","content":"markdown"} | {"type":"edit_note","id":"id catatan","title":"","content":"markdown lengkap baru"} | {"type":"add_flashcards","title":"","cards":[{"q":"","a":""}]} | {"type":"add_quiz","title":"","items":[{"q":"","options":["","","",""],"answer":0,"explain":""}]} | {"type":"add_mindmap","title":"","code":"kode mermaid mindmap"}.
Kalau tidak perlu mengubah data, actions = [].`;
const AL={add_note:"menambah catatan",edit_note:"mengubah catatan",add_flashcards:"membuat flashcard",add_quiz:"membuat kuis",add_mindmap:"membuat mind map"};
function drawChat(){$("#cm").innerHTML=S.chat.length?S.chat.map((m,i)=>`<div class="msg ${m.r}">${marked.parse(esc(m.t))}</div>`+(m.acts||[]).map((a,j)=>`<div class=act>AI ingin ${AL[a.type]||"mengubah data"} tentang “${esc(a.title)}”${a.st?`<br><b style="color:var(--${a.st=="ok"?"ok":"mut"})">${a.st=="ok"?"Disetujui":"Ditolak"}</b>`:`<br><button class=b onclick="decide(${i},${j},1)">Setuju</button><button class="b g" onclick="decide(${i},${j},0)">Tidak</button>`}</div>`).join("")).join(""):'<p class=mut>Mulai dengan menulis permintaan di bawah.</p>';$("#cm").scrollTop=1e9}
window.decide=(i,j,ok)=>{const a=S.chat[i].acts[j];if(ok){const id=uid(),t=a.type;if(t=="add_note")S.notes.unshift({id,title:a.title,content:a.content});if(t=="edit_note"){const n=S.notes.find(x=>x.id==a.id);if(n)n.content=a.content}if(t=="add_flashcards")S.decks.unshift({id,title:a.title,cards:a.cards});if(t=="add_quiz")S.quizzes.unshift({id,title:a.title,items:a.items});if(t=="add_mindmap")S.maps.unshift({id,title:a.title,code:clean(a.code)})}a.st=ok?"ok":"no";save();drawChat()};
window.send=async()=>{const i=$("#ci"),m=i.value.trim();if(!m)return;i.value="";S.chat.push({r:"u",t:m});save();drawChat();try{const ctx=S.notes.map(n=>`[${n.id}] ${n.title}: ${n.content.slice(0,400)}`).join("\n"),h=S.chat.slice(-10).map(x=>(x.r=="u"?"User: ":"AI: ")+x.t).join("\n"),d=await ai(`Catatan pengguna:\n${ctx||"(kosong)"}\n\nRiwayat:\n${h}`,{json:1,system:CH});S.chat.push({r:"a",t:d.reply,acts:d.actions||[]})}catch(e){S.chat.push({r:"a",t:"Error: "+e.message})}save();drawChat()};
window.clr=async()=>{if(await ask("Hapus semua riwayat chat?")){S.chat=[];save();drawChat()}};
// ---- Tersimpan & backup ----
const LB={notes:"Catatan",decks:"Flashcard",quizzes:"Kuis",essays:"Kuis Esai",exams:"Prediksi Ujian",maps:"Mind Map",sums:"Rangkuman"};
window.exp=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="belajarwithai-backup.json";a.click()};
window.imp=async el=>{try{const d=JSON.parse(await el.files[0].text());for(const k in LB)for(const x of d[k]||[])if(!S[k].some(y=>y.id==x.id))S[k].push(x);save();go("saved");toast("Backup dipulihkan")}catch{toast("File backup tidak valid")}};
// ---- Navigasi ----
const NAV=[["notes","Catatan"],["decks","Flashcard"],["quizzes","Kuis"],["essays","Kuis Esai"],["exams","Prediksi Ujian"],["maps","Mind Map"],["sums","Rangkuman"],["solve","Kerjakan Soal"],["chat","Chat AI"],["merge","Merge PDF"],["saved","Tersimpan"]];
function go(v){FILES=[];SEL="";$("#nav").innerHTML='<div class="logo">Belajar<b>WithAI</b></div>'+NAV.map(([k,l])=>`<button class="${k==v?"on":""}" onclick="go('${k}')">${l}</button>`).join("")+'<p id=sv class=mut>✓ Tersimpan otomatis</p>';const M=$("#main");
if(v=="notes"){M.innerHTML=head("Catatan","Ubah file atau video YouTube jadi catatan rapi dan lengkap.")+srcBox()+'<button class=b onclick="mkNote()">Buat catatan dari file</button><div class=card><label>Atau import dari link YouTube</label><input id=yt placeholder="https://youtube.com/watch?v=…"><button class=b onclick="ytNote()">Import dari YouTube</button></div><div id=out></div><div id=lib></div>';libr("notes")}
else if(v=="chat"){M.innerHTML=head("Chat AI","Minta AI membuat catatan, flashcard, kuis, atau mind map. Setiap perubahan butuh persetujuanmu.")+'<div id=cm style="max-height:55vh;overflow:auto"></div><div class=card><textarea id=ci rows=2 placeholder="Contoh: Tolong bikin catatan tentang Kimia"></textarea><button class=b onclick="send()">Kirim</button><button class="b g" onclick="clr()">Hapus chat</button></div>';drawChat()}
else if(v=="merge"){M.innerHTML=head("Merge PDF","Gabungkan beberapa PDF jadi satu (maks 20), langsung di browser.")+'<div class=card><div id=fp>'+fp(".pdf")+'</div><button class=b onclick="merge()">Gabungkan &amp; download</button></div>'}
else if(v=="saved"){const any=Object.keys(LB).some(k=>S[k].length);M.innerHTML=head("Tersimpan","Semua hasilmu tersimpan otomatis di browser ini.")+(any?Object.entries(LB).map(([k,l])=>S[k].length?`<h3>${l} (${S[k].length})</h3><div class=card>${S[k].map(x=>`<div class=li><button onclick="go('${k}');openI('${k}','${x.id}')">${esc(x.title)}</button><i onclick="del('${k}','${x.id}',1)">Hapus</i></div>`).join("")}</div>`:"").join(""):'<div class=card>Belum ada yang tersimpan. Buat catatan atau kuis dulu.</div>')+'<div class=card><button class=b onclick="exp()">Backup (download)</button><button class="b g" onclick="$(\'#imp\').click()">Restore dari backup</button><input type=file id=imp hidden accept=".json" onchange="imp(this)"></div>'}
else{const T=TOOLS[v];M.innerHTML=head(...T.h)+srcBox()+(v=="exams"?'<div class=card id=eo>'+exOpts()+'</div>':"")+`<button class=b onclick="gen('${v}')">${T.b}</button><div id=out></div><div id=lib></div>`;libr(T.k||v)}}
go("notes");
</script></body></html>
